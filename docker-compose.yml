# 本项目所有服务（应用 + 监控）都在这一个文件里
# 监控服务用 profiles 控制，默认不启动，第 3 章会讲

services:
  # ==================== 数据库 ====================
  db:
    image: mysql:8.0
    container_name: wp_db
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --max-connections=200
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      TZ: Asia/Shanghai
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      # 用 mysql 客户端真连一次库，比 mysqladmin ping 可靠（见下方说明）
      test:
        - CMD-SHELL
        - mysql -h 127.0.0.1 -u root -p"$$MYSQL_ROOT_PASSWORD" -e "SELECT 1" >/dev/null 2>&1
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 40s
    networks:
      - ops-net
    mem_limit: 1200m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ==================== 应用（PHP-FPM） ====================
  wordpress:
    image: wordpress:6-fpm
    container_name: wp_app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_USER: ${MYSQL_USER}
      WORDPRESS_DB_PASSWORD: ${MYSQL_PASSWORD}
      WORDPRESS_DB_NAME: ${MYSQL_DATABASE}
      TZ: Asia/Shanghai
      # 追加到 wp-config.php 的额外配置
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_HOME', 'https://${DOMAIN}');
        define('WP_SITEURL', 'https://${DOMAIN}');
        define('DISALLOW_FILE_EDIT', true);
        define('WP_MEMORY_LIMIT', '128M');
    volumes:
      - wp_data:/var/www/html
      # php.ini 配置文件挂载到容器里，覆盖默认配置，便于修改上传文件大小
      - ./php.ini:/usr/local/etc/php/conf.d/uploads.ini
    healthcheck:
      test:
        - CMD-SHELL
        - "php -r 'exit(@fsockopen(\"127.0.0.1\", 9000) ? 0 : 1);'"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    networks:
      - ops-net
    mem_limit: 512m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ==================== Web 入口 ====================
  nginx:
    image: nginx:stable
    container_name: wp_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "8443:443"
    volumes:
      # 只读挂载网站文件：Nginx 只需读，不需要写
      - wp_data:/var/www/html:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      # .htpasswd` 挂进 nginx 容器
      - ./nginx/.htpasswd:/etc/nginx/.htpasswd:ro
      # Let's Encrypt 验证目录（宿主机 certbot 写，容器读）
      - ./certbot/www:/var/www/certbot:ro
      # 证书目录（宿主机 certbot 写，容器读）
            # 改成宿主机真实证书目录：certbot 续期后容器直接看到新证书，不用复制
      - /etc/letsencrypt:/etc/letsencrypt:ro
      # 日志挂到宿主机，方便排查和做日志轮转
      - ./logs/nginx:/var/log/nginx
    depends_on:
      - wordpress
    networks:
      - ops-net
    mem_limit: 128m
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ==================== 监控栈（默认不启动，加 --profile monitoring 才运行）====================

  # ---------- 主机指标 ----------
  node-exporter:
    image: prom/node-exporter:v1.10.2
    container_name: node-exporter
    restart: unless-stopped
    profiles: ["monitoring"]
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/rootfs
      # 排除掉容器自己的 overlay、tmpfs 等文件系统，否则磁盘用量会看起来很奇怪
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc|var/lib/docker/.+)($$|/)
            # ★ 新增：读取自定义指标目录
      - --collector.textfile.directory=/var/lib/node_exporter/textfile
    volumes:
      # 宿主机的 /proc、/sys、/ 以只读方式挂进来，node-exporter 靠读这些文件获取主机信息
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
            # ★ 新增：把备份脚本写的指标目录挂进来
      - /var/lib/node_exporter/textfile:/var/lib/node_exporter/textfile:ro
    networks:
      - ops-net
    mem_limit: 128m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ---------- 容器指标 ----------
  cadvisor:
    # ⚠️ 注意镜像地址：不要用网上的 google/cadvisor:latest（见下方说明）
    image: ghcr.io/google/cadvisor:v0.60.5
    container_name: cadvisor
    restart: unless-stopped
    profiles: ["monitoring"]
    # cAdvisor 需要读取宿主机的 cgroup 和 docker 数据，所以要提权
    privileged: true
    command:
      - --docker_only=true
      - --housekeeping_interval=30s
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    devices:
      - /dev/kmsg:/dev/kmsg
    networks:
      - ops-net
    mem_limit: 256m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ---------- 站点拨测 ----------
  blackbox-exporter:
    image: prom/blackbox-exporter:v0.26.0
    container_name: blackbox-exporter
    restart: unless-stopped
    profiles: ["monitoring"]
    volumes:
      - ./blackbox/blackbox.yml:/etc/blackbox_exporter/config.yml:ro
    networks:
      - ops-net
    mem_limit: 64m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ---------- 指标存储 + 告警判断 ----------
  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: prometheus
    restart: unless-stopped
    profiles: ["monitoring"]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      # 数据保留策略：15 天 / 最多 2GB（你的磁盘只有几十 G，必须设上限）
      - --storage.tsdb.retention.time=15d
      - --storage.tsdb.retention.size=2GB
      # 允许通过 HTTP API 重载配置（改规则后不用重启）
      - --web.enable-lifecycle
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/rules:/etc/prometheus/rules:ro
      - prom_data:/prometheus
    ports:
      # ★ 只监听本机回环地址：Prometheus 没有任何认证，绝不能暴露到公网
      - "127.0.0.1:9090:9090"
    networks:
      - ops-net
    mem_limit: 512m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ---------- 告警分发 ----------
  alertmanager:
    image: prom/alertmanager:v0.28.0
    container_name: alertmanager
    restart: unless-stopped
    profiles: ["monitoring"]
    volumes:
      # ⚠️ 这个文件里有邮箱授权码，已加入 .gitignore，不进 Git
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    # ⚠️ 这里不要传 SMTP_FROM / SMTP_AUTH_PASSWORD 之类的变量：
    #    Alertmanager 不会展开配置文件里的 ${VAR}（它只做 YAML 解析 + Go 模板渲染），
    #    传进来也没人读，反而会让人误以为"改了 .env 就生效"。
    #    SMTP 账号/授权码请直接写在 alertmanager/alertmanager.yml 里（该文件已 gitignore）。
    ports:
      - "127.0.0.1:9093:9093"
    networks:
      - ops-net
    mem_limit: 128m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ---------- 可视化 ----------
  grafana:
    image: grafana/grafana:12.3.1
    container_name: grafana
    restart: unless-stopped
    profiles: ["monitoring"]
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      # 让 Grafana 生成的链接用我们的域名（否则会生成 http://localhost:3000 的链接）
      GF_SERVER_ROOT_URL: https://${MONITOR_DOMAIN}
      GF_SERVER_DOMAIN: ${MONITOR_DOMAIN}
      TZ: Asia/Shanghai
    volumes:
      - grafana_data:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"
    networks:
      - ops-net
    mem_limit: 384m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  ops-net:
    name: ops-net
    driver: bridge

volumes:
  db_data:
  wp_data:
  prom_data:
  alertmanager_data:
  grafana_data: