# ============================================================
# 监控面板站点：monitor.ddgmm.top
# 作用：把 Grafana 通过 Nginx 反代出去，并加上 basic auth 密码保护
# ============================================================

server {
    listen 80;
    listen [::]:80;
    server_name monitor.ddgmm.top;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name monitor.ddgmm.top;

    # 复用同一张证书（它现在同时覆盖 blog 和 monitor）
    ssl_certificate     /etc/letsencrypt/live/blog.ddgmm.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/blog.ddgmm.top/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Frame-Options           "SAMEORIGIN" always;
    add_header X-Content-Type-Options    "nosniff" always;
    server_tokens off;

    access_log /var/log/nginx/monitor.access.log;
    error_log  /var/log/nginx/monitor.error.log warn;

    # ---------- 密码保护 ----------
    # Grafana 自己也有登录，但"多一层门"能挡掉自动化扫描和探测
    auth_basic "Restricted Monitoring Area";
    auth_basic_user_file /etc/nginx/.htpasswd;

    # 允许的请求体大小（Grafana 导入面板时可能较大）
    client_max_body_size 16m;

    location / {
        proxy_pass http://grafana:3000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Grafana 的实时推送（Live）走 WebSocket，需要下面三行
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_read_timeout 300;
    }
}