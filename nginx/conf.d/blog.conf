# ============================================================
# WordPress 站点 · 完整版
# 80 端口：Let's Encrypt 验证 + 其他请求 301 跳 HTTPS
# 443 端口：正式的 HTTPS 站点
# ============================================================

server {
    listen 80;
    listen [::]:80;
    server_name blog.ddgmm.top;

    # 证书续期验证必须走 HTTP，所以这个 location 放在跳转之前
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    # 其余所有请求永久跳转到 HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;                      # nginx 1.25.1+ 的写法；老版本用 listen 443 ssl http2;
    server_name blog.ddgmm.top;

    # ---------- 证书 ----------
    ssl_certificate     /etc/letsencrypt/live/blog.ddgmm.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/blog.ddgmm.top/privkey.pem;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # ---------- 安全响应头 ----------
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Frame-Options           "SAMEORIGIN" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;

    # 隐藏版本号（不告诉攻击者你用的 nginx 版本）
    server_tokens off;

    root /var/www/html;
    index index.php index.html;

    client_max_body_size 64m;

    access_log /var/log/nginx/blog.access.log;
    error_log  /var/log/nginx/blog.error.log warn;

    # ---------- 安全规则（顺序很重要）----------
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # 上传目录禁止执行 PHP —— 必须在 location ~ \.php$ 之前
    location ~* ^/wp-content/uploads/.*\.php$ {
        deny all;
        access_log off;
    }

    location = /wp-config.php { deny all; }
    location = /readme.html   { deny all; }
    location = /license.txt   { deny all; }

    # ---------- PHP ----------
    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_pass wordpress:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;

        # ★ 关键：告诉 PHP「用户其实是走 HTTPS 进来的」
        # SSL 是在 Nginx 这里终止的，PHP-FPM 收到的是普通 HTTP 请求。
        # 不加这两行，WordPress 会以为自己是 http 站点，进而无限重定向或生成 http 链接
        fastcgi_param HTTPS on;
        fastcgi_param HTTP_X_FORWARDED_PROTO https;

        fastcgi_read_timeout 300;
        fastcgi_buffer_size 128k;
        fastcgi_buffers 4 256k;
    }

    # ---------- 静态资源缓存 ----------
    # ⚠️ add_header 的继承规则：子级一旦出现 add_header，父级的全部失效。
    #    所以这里必须把安全头再写一遍，否则这些资源的响应会缺少安全头。
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|webp)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
    }

    # ---------- 主路由 ----------
    location / {
        try_files $uri $uri/ /index.php?$args;
    }
}
